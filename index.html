lus.gov/evaluatinghealthinformation.html`,interactions:`https://www.niaaa.nih.gov/health-professionals-communities/core-resource-on-alcohol/alcohol-medication-interactions-potentially-dangerous-mixes`,alcohol:`https://www.niaaa.nih.gov/publications/brochures-and-fact-sheets/understanding-dangers-of-alcohol-overdose`,emergency:`https://www.cdc.gov/stop-overdose/response/index.html`,naloxone:`https://www.cdc.gov/overdose-prevention/reversing-overdose/about-naloxone.html`,driving:`https://www.nhtsa.gov/risky-driving/drug-impaired-driving`,refusal:`https://www.niaaa.nih.gov/alcohols-effects-health/niaaa-middle-school/right-resist`,support:`https://www.cdc.gov/stop-overdose/stigma-reduction/index.html`},Fs=[{id:`categories`,title:`First connections`,subtitle:`Categories & named examples`,description:`The network is waking up. Build your science stations and stop mixed-up categories from reaching the community feed.`,lessons:[{title:`Know the families`,text:`Cocaine and amphetamine are stimulants. Diazepam is a benzodiazepine and CNS depressant; alcohol is also a depressant. Morphine, fentanyl and heroin are opioids. Some stimulants treat ADHD, some depressants treat anxiety or seizures, and some opioids treat pain under medical care.`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{title:`Perception has several routes`,text:`LSD and psilocybin are psychedelics. Ketamine is a dissociative anesthetic. Cannabis contains cannabinoids such as THC. A shared effect does not put every substance into the same family.`,sourceLabel:`National Institute on Drug Abuse · Psychedelic and dissociative drugs`,sourceUrl:q.psychedelics},{title:`A category is a starting point`,text:`“CNS depressant” means slowing central nervous system activity, not a guaranteed sad mood. Categories describe broad patterns; individual drugs and circumstances still matter. MDMA has stimulant-like effects and can also alter perception.`,sourceLabel:`National Institute on Drug Abuse · MDMA (Ecstasy/Molly)`,sourceUrl:q.mdma}],claims:[{id:`category-sadness`,label:`Depressant = sadness`,claim:`A CNS depressant is a drug that always makes someone sad.`,correction:`CNS depressants slow brain activity. Drowsiness and impaired coordination are possible effects; the category does not predict a single emotion.`,kind:`science`,sourceLabel:`National Institute on Drug Abuse · Prescription medicines`,sourceUrl:q.prescription},{id:`category-ketamine`,label:`Ketamine is an opioid`,claim:`Ketamine belongs in the opioid family alongside morphine.`,correction:`Ketamine is a dissociative anesthetic. Morphine, fentanyl and heroin are opioids. Medical uses or overlapping effects do not make two drugs the same type.`,kind:`science`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{id:`category-identical`,label:`One family, one effect`,claim:`Every drug in a category produces identical effects in everyone.`,correction:`A category organizes broad patterns. Individual drugs, the person and the circumstances can change the effects and risks.`,kind:`science`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{id:`category-mdma`,label:`MDMA fits one box`,claim:`MDMA cannot have both stimulant-like and perception-altering effects.`,correction:`MDMA can increase energy and alertness and also alter perception. Categories help you learn; their boundaries are not sealed boxes.`,kind:`science`,sourceLabel:`National Institute on Drug Abuse · MDMA (Ecstasy/Molly)`,sourceUrl:q.mdma}],discussion:`Which category name is easiest to misunderstand? Explain it in one plain sentence.`},{id:`effects`,title:`Crossed signals`,subtitle:`Effects, benefits & risks`,description:`These messages sound confident about how drugs work. Give the network the fuller picture, including what an effect cannot prove.`,lessons:[{title:`A benefit can come with risk`,text:`Stimulants such as cocaine and amphetamine can increase alertness, heart rate and blood pressure; misuse can lead to addiction. Morphine can relieve pain and slow breathing. Opioid overdose can stop breathing. Diazepam can cause drowsiness and impaired coordination.`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{title:`Different changes in experience`,text:`Ketamine can cause detachment from the body or surroundings. LSD and psilocybin can strongly change perception, mood and thoughts; fear or confusion can occur. These descriptions are useful patterns, not promises about any one person.`,sourceLabel:`National Institute on Drug Abuse · Psychedelic and dissociative drugs`,sourceUrl:q.psychedelics},{title:`Feeling different is not a test`,text:`THC-containing cannabis can impair memory, attention and coordination; some people experience anxiety or paranoia. Feeling more alert does not prove safe performance. A symptom by itself cannot reliably identify a drug or its cause.`,sourceLabel:`Centers for Disease Control and Prevention · Cannabis health effects`,sourceUrl:q.cannabisHealth}],claims:[{id:`effect-thc`,label:`THC sharpens memory`,claim:`THC reliably sharpens memory and coordination.`,correction:`THC-containing cannabis can impair memory, attention and coordination. A confident feeling is not proof of improved performance.`,kind:`science`,sourceLabel:`Centers for Disease Control and Prevention · Cannabis and brain health`,sourceUrl:q.cannabis},{id:`effect-pain`,label:`Pain relief = no risk`,claim:`Because morphine relieves pain, it cannot threaten breathing.`,correction:`Morphine can relieve pain and suppress breathing. A useful medical effect does not cancel another risk; opioid overdose can stop breathing.`,kind:`science`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{id:`effect-alertness`,label:`Awake means unimpaired`,claim:`Feeling awake proves someone is safe to drive.`,correction:`Impairment can affect judgment, coordination and reaction time. Feeling alert or fine is not a reliable driving-safety test.`,kind:`science`,sourceLabel:`National Highway Traffic Safety Administration · Drug-impaired driving`,sourceUrl:q.driving},{id:`effect-identification`,label:`Drowsy = identified`,claim:`Seeing someone look drowsy proves which drug they used.`,correction:`Drowsiness is an observation with many possible causes. Effects can overlap. Describe what you see without claiming a drug has been identified.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Background on overlapping drug effects`,sourceUrl:q.glossary}],discussion:`How can a useful effect and a serious risk both be true for the same medicine?`},{id:`aliases`,title:`Name game`,subtitle:`Slang & uncertain contents`,description:`Nicknames are moving fast. Context stations stop familiar words from becoming false promises about what is inside.`,lessons:[{title:`Translate the vocabulary`,text:`Common associations: acid → LSD; shrooms → psilocybin mushrooms; weed or pot → cannabis. This is vocabulary knowledge, not a way to test an actual substance.`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{title:`Two more common names`,text:`Molly and ecstasy are associated with MDMA. Special K is associated with ketamine. Slang varies by place and changes over time.`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{title:`A label is not a lab result`,text:`A nickname does not verify identity, purity, ingredients or safety. Something called Molly or ecstasy may have different contents than expected. Keep “associated with” separate from “confirmed to contain.”`,sourceLabel:`National Institute on Drug Abuse · MDMA (Ecstasy/Molly)`,sourceUrl:q.mdma}],claims:[{id:`alias-molly`,label:`Molly means pure MDMA`,claim:`Anything called Molly is guaranteed to be pure MDMA.`,correction:`Molly and ecstasy are common names associated with MDMA. They do not guarantee the contents or purity of an actual substance.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · MDMA (Ecstasy/Molly)`,sourceUrl:q.mdma},{id:`alias-acid`,label:`Acid means cannabis`,claim:`Acid is the usual slang association for cannabis.`,correction:`Acid is commonly associated with LSD. Weed and pot are associated with cannabis. Knowing the glossary still cannot verify actual contents.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{id:`alias-special-k`,label:`Special K proves purity`,claim:`A packet labelled Special K proves that it contains pure ketamine.`,correction:`Special K is associated with ketamine. The observed label tells you what was written, not what a substance contains or whether it is safe.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary},{id:`alias-fixed`,label:`Slang never changes`,claim:`Drug nicknames mean exactly the same thing everywhere and forever.`,correction:`Slang can change with place and time. Shrooms commonly refers to psilocybin mushrooms, but a familiar word is still not a reliable contents test.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Drug reference guide`,sourceUrl:q.glossary}],discussion:`Finish this sentence: “I recognize the name, but I still do not know…”`},{id:`evidence`,title:`Check before sharing`,subtitle:`Observation, inference & sources`,description:`A confident headline can travel farther than its evidence. Keep the source notes and the unknowns attached to every message.`,lessons:[{title:`See it, or infer it?`,text:`Fictional note: “At 18:00, a person looked drowsy. A packet labelled Molly was on a nearby bench. No use was observed.” The appearance and label were observed. Ownership, use and the cause of drowsiness remain unknown.`,sourceLabel:`National Institute on Drug Abuse · Background on drug effects and labels`,sourceUrl:q.glossary},{title:`Follow the publishing trail`,text:`Example: source note at 18:00 → caption drafted at 18:07 → post published at 18:10. Compare the wording, source and dates. Publishing later does not make a claim true. A post alone also cannot establish its author’s intentions.`,sourceLabel:`National Library of Medicine · Evaluating health information`,sourceUrl:q.evidence},{title:`Keep uncertainty useful`,text:`“The cause is unknown” is more accurate than inventing a diagnosis or claiming no use occurred. Missing evidence should remain visible. If someone cannot be awakened or is breathing abnormally, seek emergency help without waiting to solve the cause.`,sourceLabel:`Centers for Disease Control and Prevention · Responding to a suspected overdose`,sourceUrl:q.emergency}],claims:[{id:`evidence-proximity`,label:`Nearby means theirs`,claim:`A packet next to someone proves that it belongs to them and they used it.`,correction:`Proximity establishes a location. It does not establish ownership or use. Keep the observation and the explanation separate.`,kind:`context`,sourceLabel:`National Library of Medicine · Evaluating health information`,sourceUrl:q.evidence},{id:`evidence-published`,label:`Published means proven`,claim:`A newer published caption must be more accurate than its original notes.`,correction:`A date tells you when something was published. Compare the caption with its sources and evidence; later wording can still add unsupported guesses.`,kind:`context`,sourceLabel:`National Library of Medicine · Evaluating health information`,sourceUrl:q.evidence},{id:`evidence-absence`,label:`No proof = no use`,claim:`If use was not observed, it is certain that no use occurred.`,correction:`“Not established” and “did not happen” are different claims. These notes do not establish use, rule it out or explain the person’s condition.`,kind:`context`,sourceLabel:`National Library of Medicine · Evaluating health information`,sourceUrl:q.evidence},{id:`evidence-delay`,label:`Solve it before helping`,claim:`When someone cannot wake up, you should identify the substance before seeking help.`,correction:`Get emergency help immediately. Describe the location, responsiveness and breathing, and follow dispatcher instructions. You do not need to identify a substance first.`,kind:`support`,sourceLabel:`Centers for Disease Control and Prevention · Responding to a suspected overdose`,sourceUrl:q.emergency}],discussion:`Retell the fictional note using only observations. Then name one thing it leaves unknown.`},{id:`myths`,title:`Too good to be true`,subtitle:`Medical use, natural labels & combinations`,description:`The next wave mixes a little truth with a big leap. Use science and context together to repair the whole claim.`,lessons:[{title:`A prescription is personal`,text:`Taking someone else’s prescription is misuse, even if your symptoms seem similar. Medicines can have real benefits and real risks. A clinician or pharmacist can help with questions about your own treatment.`,sourceLabel:`National Institute on Drug Abuse · Prescription medicines`,sourceUrl:q.prescription},{title:`Reassuring labels leave things out`,text:`Plant origin does not prove safety: cannabis can impair performance, and cannabis use disorder can develop. Lower addiction potential does not mean no other risk. A controlled clinical study does not establish that unsupervised use is safe.`,sourceLabel:`Centers for Disease Control and Prevention · Cannabis health effects`,sourceUrl:q.cannabisHealth},{title:`Different routes, shared risk`,text:`Opioids, benzodiazepines and alcohol act through different receptor systems but can all suppress activity involved in breathing. Their effects can combine, increasing respiratory-depression and overdose risk. Different categories do not cancel each other out.`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · Alcohol–medication interactions`,sourceUrl:q.interactions}],claims:[{id:`myth-prescription`,label:`Their prescription fits`,claim:`My friend’s prescription is safe for me because our symptoms match.`,correction:`Symptoms that seem similar do not establish the same medical needs. Taking someone else’s prescription is misuse; get individual medical advice.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Prescription medicines`,sourceUrl:q.prescription},{id:`myth-natural`,label:`Natural means risk-free`,claim:`A plant-derived drug cannot cause impairment or addiction.`,correction:`Plant origin is not a safety test. Cannabis can impair memory and coordination, and cannabis use disorder can develop.`,kind:`science`,sourceLabel:`Centers for Disease Control and Prevention · Cannabis health effects`,sourceUrl:q.cannabisHealth},{id:`myth-clinical`,label:`Studied means safe`,claim:`A clinical study or low addiction potential proves a drug has no risks outside medical care.`,correction:`Studies use specific conditions and monitoring. They do not prove unsupervised safety. Even with lower addiction potential, psychedelics can cause fear, confusion and other harms.`,kind:`context`,sourceLabel:`National Institute on Drug Abuse · Psychedelic and dissociative drugs`,sourceUrl:q.psychedelics},{id:`myth-combinations`,label:`Different risks cancel`,claim:`Morphine, diazepam and alcohol work differently, so combining them cancels breathing risk.`,correction:`Different mechanisms can converge on breathing suppression. Combining opioids, benzodiazepines and alcohol can increase overdose risk.`,kind:`science`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · Alcohol–medication interactions`,sourceUrl:q.interactions}],discussion:`What does “it has medical uses” tell us? What does it leave unanswered?`},{id:`emergency`,title:`Make help happen`,subtitle:`Recognize urgency & act`,description:`Clear the messages that delay real help. This is a fictional practice wave. In a real emergency, stop playing and contact emergency services.`,lessons:[{title:`You do not need a diagnosis`,text:`Someone who cannot be awakened or is breathing slowly or abnormally needs urgent help. For suspected overdose, call 911 in the US or the local emergency number elsewhere. Share your location and observations; do not wait for every possible symptom.`,sourceLabel:`Centers for Disease Control and Prevention · Responding to a suspected overdose`,sourceUrl:q.emergency},{title:`Stay and get support moving`,text:`Stay with the person and follow dispatcher instructions. If opioid overdose is possible and naloxone is available, give it according to its directions. Keep emergency care coming even if the person improves; naloxone does not replace it.`,sourceLabel:`Centers for Disease Control and Prevention · About naloxone`,sourceUrl:q.naloxone},{title:`Skip the sober-up tricks`,text:`Coffee, cold showers and walking do not reverse alcohol overdose. Do not leave someone to “sleep it off.” Tell responders what you know, including substances or medicines involved if known; uncertainty must not delay the call.`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · Alcohol overdose`,sourceUrl:q.alcohol}],claims:[{id:`emergency-coffee`,label:`Coffee reverses overdose`,claim:`Coffee, a cold shower or a walk can reverse an alcohol overdose.`,correction:`These do not reverse alcohol overdose. Get emergency help, stay with the person and follow dispatcher instructions.`,kind:`science`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · Alcohol overdose`,sourceUrl:q.alcohol},{id:`emergency-wait`,label:`Wait for every symptom`,claim:`You need every overdose symptom and a confirmed drug name before calling.`,correction:`Call immediately for suspected overdose. Inability to wake up or abnormal breathing is urgent. Describe what you observe even when the cause is unknown.`,kind:`context`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · Alcohol overdose`,sourceUrl:q.alcohol},{id:`emergency-sleep`,label:`Just sleep it off`,claim:`Someone who cannot be awakened should be left alone to sleep it off.`,correction:`An unresponsive person needs urgent help. Call the emergency number, stay with them and follow dispatcher instructions.`,kind:`support`,sourceLabel:`Centers for Disease Control and Prevention · Responding to a suspected overdose`,sourceUrl:q.emergency},{id:`emergency-naloxone`,label:`Naloxone replaces care`,claim:`Once naloxone helps, emergency care is no longer needed.`,correction:`Naloxone can reverse opioid overdose, but emergency care is still needed. Stay with the person and keep help coming even if they improve.`,kind:`support`,sourceLabel:`Centers for Disease Control and Prevention · About naloxone`,sourceUrl:q.naloxone}],discussion:`What could you tell a dispatcher about your location and the person without knowing the cause?`},{id:`support`,title:`Stronger together`,subtitle:`Boundaries, sober rides & recovery`,description:`The final wave targets the choices that help people look out for each other. Build a network where a clear no and a request for help can travel.`,lessons:[{title:`No perfect speech required`,text:`You can decline, repeat a boundary or change your mind after saying maybe. “No thanks” and “I changed my mind” are enough. An ally can back you up or leave with you; a friend’s no deserves respect.`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · The right to resist`,sourceUrl:q.refusal},{title:`Turn a ride into a plan`,text:`Do not drive after an impairing substance or ride with an impaired driver. Arrange a sober ride, an exact pickup place and somewhere safe to wait. A past uneventful trip does not make impairment safe; outcomes also involve luck.`,sourceLabel:`National Highway Traffic Safety Administration · Drug-impaired driving`,sourceUrl:q.driving},{title:`Leave the door open`,text:`Substance use disorders are treatable health conditions. Shame can make asking for help harder. Listen without blame and connect with a trusted adult, counselor or healthcare professional. Support remains available after a difficult choice; a friend need not solve everything alone.`,sourceLabel:`Centers for Disease Control and Prevention · Stigma reduction`,sourceUrl:q.support}],claims:[{id:`support-maybe`,label:`Maybe means you owe it`,claim:`If you said maybe earlier, you owe the group a yes now.`,correction:`You can change your mind. Repeat your boundary, ask an ally for support or leave. You do not owe anyone a debate or a perfect explanation.`,kind:`support`,sourceLabel:`National Institute on Alcohol Abuse and Alcoholism · The right to resist`,sourceUrl:q.refusal},{id:`support-luck`,label:`Safe once, safe always`,claim:`An impaired driver got home safely once, so the next trip is safe too.`,correction:`One outcome does not remove a risk. Arrange a sober ride with a specific pickup place and waiting plan; feeling fine is not proof of driving ability.`,kind:`context`,sourceLabel:`National Highway Traffic Safety Administration · Drug-impaired driving`,sourceUrl:q.driving},{id:`support-willpower`,label:`Addiction is weakness`,claim:`Struggling to stop using is just weak willpower, so blame will fix it.`,correction:`Substance use disorders are treatable health conditions. Blame can make help harder to seek. Listen and help someone connect with qualified support.`,kind:`support`,sourceLabel:`Centers for Disease Control and Prevention · Stigma reduction`,sourceUrl:q.support},{id:`support-too-late`,label:`Too late to ask for help`,claim:`After a difficult choice, it is too late to ask anyone for support.`,correction:`Asking for help remains an option. A trusted adult, counselor or healthcare professional can help. Friends can offer care without carrying every responsibility alone.`,kind:`support`,sourceLabel:`Centers for Disease Control and Prevention · Stigma reduction`,sourceUrl:q.support}],discussion:`Try a short refusal, a specific sober-pickup request or an offer of support. You can speak, think silently or pass.`}],Is={research:O,c
